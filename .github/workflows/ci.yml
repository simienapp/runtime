# Every pull request and every push to main: the runtime builds, lints clean
# where it is held to that, and its tests pass, including a served app that
# checks the WinterTC Minimum Common API (crates/cli/tests/web_apis.rs).
# Releases get their own workflow later.
name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    name: Runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - name: sccache is required
        run: sccache --show-stats
      - name: Toolchain (rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add clippy
      # tao/wry (dev tooling) and the native UI crates link against these.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libxdo-dev \
            libasound2-dev libfontconfig1-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libegl1-mesa-dev libvulkan-dev libxcb-shape0-dev libxcb-xfixes0-dev clang pkg-config libssl-dev
      - name: Check
        run: cargo check --locked --workspace --all-targets
      - name: Clippy (crates held to zero warnings)
        run: cargo clippy --locked -p web_host -p server -p simien -p output -p container -p project -p schema --all-targets --no-deps -- -D warnings
      - name: Test
        run: cargo test --locked -p web_host -p server -p simien -p output -p container -p project -p schema -p platform_server -p pool
      - name: Web APIs in a served app
        run: cargo test --locked -p cli --test web_apis
      - run: sccache --show-stats
