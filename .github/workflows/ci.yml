# Every pull request and every push to main: the runtime builds, lints clean
# where it is held to that, and its tests pass, including a served app that
# checks the WinterTC Minimum Common API (crates/simien/tests/web_apis.rs).
# Releases get their own workflow later.
name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    name: Runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - name: sccache is required
        run: sccache --show-stats
      - name: Toolchain (rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add clippy
      # tao/wry (dev tooling) and the native UI crates link against these.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libxdo-dev \
            libasound2-dev libfontconfig1-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libegl1-mesa-dev libvulkan-dev libxcb-shape0-dev libxcb-xfixes0-dev clang pkg-config libssl-dev
      - name: Pre-approved permissions match simienapp/permissions at the pin
        run: |
          pin=$(cat crates/packages/permissions-pin)
          curl -fsSL "https://raw.githubusercontent.com/simienapp/permissions/$pin/permissions.json" -o "$RUNNER_TEMP/permissions.json"
          cmp "$RUNNER_TEMP/permissions.json" crates/packages/permissions.json
      - name: Check
        run: cargo check --locked --workspace --all-targets
      - name: Clippy (crates held to zero warnings)
        run: cargo clippy --locked -p web_host -p server -p simien -p output -p container -p project -p packages -p schema -p schema_sync -p devloop -p check -p carve_outs -p data --all-targets --no-deps -- -D warnings
      - name: Test
        run: cargo test --locked -p web_host -p server -p simien -p output -p container -p project -p packages -p schema -p check -p platform_server -p pool -p carve_outs
      - name: Web APIs in a served app
        run: cargo test --locked -p simien --test web_apis
      - run: sccache --show-stats

  # simien dev's schema sync, database loop and query engine against a real local stack: Docker (on the
  # runner) runs pg_zega and Zega through kebele, as `simien container start`
  # does. The test fails without them; it never skips.
  schema-sync:
    name: Schema sync (real Postgres + Zega)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - name: sccache is required
        run: sccache --show-stats
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      # kebele's CLI runs on Bun.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - name: kebele
        run: bun install --global kebele@0.10.0 && kebele --version
      - name: Sync rules on real data
        run: cargo test --locked -p schema_sync --test sync
      - name: simien dev's database side on real data
        run: cargo test --locked -p devloop --test devloop
      - name: The data API's query engine on real data
        run: cargo test --locked -p data --test engine
      - name: The dev data service, driven by the real client on Bun
        run: cargo test --locked -p devloop --test service
      - run: sccache --show-stats
