[package]
name = "simien_sandbox"
version.workspace = true
edition = "2024"
description = "Runs programs in an OS sandbox (Seatbelt on macOS, Landlock and seccomp on Linux): reads everything but secrets, writes only where granted, network on or off (APS 3)"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
seccompiler = "0.5.0"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
