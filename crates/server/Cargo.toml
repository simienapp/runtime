[package]
name = "server"
version.workspace = true
edition = "2024"
description = "Serves a fetch-handler app with one warm isolate per core, each serving many connections at once through simien_http"

[dependencies]
deka_host = { path = "../deka_host", default-features = false, features = ["runtime"] }
permissions = { path = "../permissions" }
serde_json = { workspace = true }
simien_node_runtime = "0.5.0"
simien_os = "0.1.0"
simien_permissions = "0.1.0"
data = { path = "../data" }
simien_core.workspace = true
simien_http = "0.2.0"
simien_websocket = "0.2.0"
tokio = { workspace = true }
web_host = { path = "../web_host" }
pool = { path = "../pool" }
security = { path = "../security" }

[dev-dependencies]
carve_outs = { path = "../carve_outs" }
serde_json = "1.0"
reqwest = { version = "0.13", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3.23.0"
