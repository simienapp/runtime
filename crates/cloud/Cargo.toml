[package]
name = "cloud"
version.workspace = true
edition = "2024"
description = "simien login / logout: who you are on Simien Cloud, by GitHub's device flow"
publish = false

[dependencies]
dcore = { path = "../dcore" }
output = { path = "../output" }
reqwest = { version = "0.13", features = ["blocking", "form", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
stdio = "0.5.0"

[dev-dependencies]
tempfile = "3.23.0"
