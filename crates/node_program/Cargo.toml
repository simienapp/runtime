[package]
name = "node_program"
version.workspace = true
edition = "2024"
description = "Runs a Node program granted dangerouslyUseNode on Simien's Node layer (APS 2), inside the sandbox Simien started it in"

[dependencies]
anyhow = "1"
data = { path = "../data" }
deka_host = { path = "../deka_host", default-features = false, features = ["runtime"] }
libc = "0.2"
packages = { path = "../packages" }
project = { path = "../project" }
runtime = { path = "../runtime" }
schema_sync = { path = "../schema_sync" }
serde_json = "1"
simien_core.workspace = true
simien_error = { workspace = true }
simien_fetch = "0.1.2"
simien_node = "0.1.6"
simien_node_runtime = "0.5.1"
simien_os = "0.1.0"
simien_permissions = "0.1.0"
tokio = { version = "1", features = ["rt", "macros", "time", "net", "fs", "io-util"] }
web_host = { path = "../web_host" }

[dev-dependencies]
tempfile = "3.23.0"
