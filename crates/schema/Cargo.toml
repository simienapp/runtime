[package]
name = "schema"
version.workspace = true
edition = "2024"
description = "schema.ts ⇄ Postgres: parse the schema, read the catalog, plan the migration with its guards, print schema.ts and the data model"
publish = false

[dependencies]
oxc_allocator = "0.152.0"
oxc_ast = "0.152.0"
oxc_parser = "0.152.0"
oxc_span = "0.152.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
