[package]
name = "pm"
version.workspace = true
edition = "2024"

[features]
default = []
# deka#992: self-update is deferred until closer to MVP. Gates `releases`
# (the deka.gg release-manifest check `self_cmd::update::check_latest`
# depends on) so it does not compile into a default build.
self-update = []

[dependencies]
deka-cli-core = { version = "0.5.0", default-features = false, features = ["registry"] }
stdio = "0.4.0"
deka-modules = "0.3.0"
permissions = { path = "../permissions" }
anyhow = "1.0"
base64 = "0.21"
dirs = "5"
reqwest = { version = "0.13", features = ["blocking", "json"] }
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.6"
json5 = "1.3"
semver = "1.0"
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "sync", "net"] }
deka_host = { path = "../deka_host", default-features = false, features = ["runtime"] }

oxc_allocator = "0.152.0"
oxc_ast = "0.152.0"
oxc_ast_visit = "0.152.0"
oxc_codegen = "0.152.0"
oxc_parser = "0.152.0"
oxc_semantic = "0.152.0"
oxc_span = "0.152.0"
oxc_str = "0.152.0"
oxc_transformer = "0.152.0"
flate2 = "1.0"
tar = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
deka-registry = { path = "../deka_registry" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
axum = "0.7"
security = { path = "../security" }
