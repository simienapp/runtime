[package]
name = "data"
version.workspace = true
edition = "2024"
description = "The data API's query engine (APS 4): a query object, checked against schema.ts, run on Postgres"
publish = false

[dependencies]
bytes = "1.12.1"
postgres = "0.19"
schema = { path = "../schema" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
container = { path = "../container" }
project = { path = "../project" }
schema_sync = { path = "../schema_sync" }
tempfile = "3.23.0"
