[package]
name = "simien"
version.workspace = true
edition = "2024"
description = "The simien CLI (also installed as `s`): the runtime, packages, and the project's dev loop"
publish = false

[[bin]]
name = "simien"
path = "src/main.rs"

[[bin]]
name = "s"
path = "src/bin/s.rs"

[dependencies]
container = { path = "../container" }
project = { path = "../project" }
devloop = { path = "../devloop" }
check = { path = "../check" }
dcore = { path = "../dcore" }
output = { path = "../output" }
packages = { path = "../packages" }
node_program = { path = "../node_program" }
stdio = "0.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
run = { path = "../run" }
runtime = { path = "../runtime" }
dev = { path = "../dev", features = ["dev-server"] }
introspect = { path = "../introspect" }
compile = { path = "../compile" }
self_cmd = { path = "../self_cmd" }

[build-dependencies]
simien_napi = "0.1.1"

[dev-dependencies]
reqwest = { version = "0.13", features = ["blocking", "json"] }
tempfile = "3.23.0"
