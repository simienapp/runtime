[package]
name = "deka_vm"
version.workspace = true
edition = "2024"
publish = false
license = "MIT"


[features]
default = []
compiler = ["dep:deka_syntax", "dep:bumpalo"]
host = ["dep:tokio", "dep:url", "dep:reqwest", "dep:sha2", "dep:sha3", "dep:blake3", "dep:getrandom", "dep:uuid", "dep:hmac", "dep:aes-gcm", "dep:bcrypt"]
ui = ["dep:deka_native_ui", "dep:deka_native_ir"]
gpu = ["ui", "deka_native_ui/runtime-shaders"]
v8-control = ["dep:simien_core"]

[dependencies]
deka_native_ui = { path = "../deka_native_ui", optional = true }
deka_native_ir = { path = "../deka_native_ir", optional = true }
simien_core = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
encoding_rs = "0.8"
url = { version = "2.5.8", optional = true }
reqwest = { version = "0.13", optional = true }
hmac = { version = "0.12", optional = true }
aes-gcm = { version = "0.10", optional = true }
bcrypt = { version = "0.15", optional = true }
sha2 = { version = "0.10", optional = true }
sha3 = { version = "0.10", optional = true }
blake3 = { version = "1", optional = true }
getrandom = { version = "0.2", optional = true }
uuid = { version = "1", optional = true, default-features = false, features = ["std"] }
deka_syntax = { path = "../deka_syntax", optional = true }
bumpalo = { version = "3.16", optional = true }
tokio = { version = "1", features = ["rt", "time", "macros", "sync"], optional = true }

[[bin]]
name = "dvmc"
path = "src/bin/compiler.rs"
required-features = ["compiler"]

[[bin]]
name = "dvm"
path = "src/bin/runtime.rs"
required-features = ["host"]

[[bin]]
name = "dvm-core"
path = "src/bin/core.rs"

[[bin]]
name = "dvm-ui"
path = "src/bin/ui.rs"
required-features = ["gpu"]

[[bin]]
name = "dvm-v8-ui"
path = "src/bin/v8_ui.rs"
required-features = ["gpu", "v8-control"]

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tempfile = "3.23"
