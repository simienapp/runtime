[package]
name = "deka_native_ui"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
publish = false

[features]
default = []
# The desktop window: winit (window, input, event loop), wgpu, and deka's vello_gpu
# fork drawing the scene. Shaders are WGSL compiled by wgpu at run time on every
# platform, so building needs no Metal, Vulkan or DirectX toolchain.
gpu = [
    "dep:winit",
    "dep:wgpu",
    "dep:vello_gpu",
    "dep:pollster",
    "dep:num_cpus",
    "dep:objc2",
    "dep:objc2-metal",
    "dep:objc2-quartz-core",
    "dep:libc",
]
world-audio = ["gpu", "dep:rodio"]
program = ["deka_native_ir/program"]
# Named by deka_vm's and deka_cli's `gpu`/`desktop` features. It selected GPUI's
# run-time Metal shader compilation; every shader is compiled at run time now.
runtime-shaders = ["gpu"]

[dependencies]
deka_native_ir = { path = "../deka_native_ir" }

# Text: parley shapes, breaks lines and falls back to system fonts (fontique); swash rasterises.
parley = "=0.12.0"
swash = "=0.2.10"
# Linux system fonts through a runtime dlopen of fontconfig: no build-time pkg-config/headers.
fontique = { version = "=0.11.1", features = ["fontconfig-dlopen"] }
serde = { version = "1", features = ["derive"] }
taffy = { version = "=0.9.0", default-features = false, features = ["std", "taffy_tree", "flexbox"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rodio = { version = "=0.21.1", default-features = false, features = ["playback"], optional = true }
winit = { version = "=0.30.13", optional = true }
# Metal on macOS, Vulkan on Linux, DX12 on Windows (the others compile out by cfg).
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl", "metal", "vulkan", "dx12"], optional = true }
# Patched to vendor/vello_gpu in the workspace manifest.
vello_gpu = { version = "=0.3.0", default-features = false, features = ["wgpu", "multithreading"], optional = true }
pollster = { version = "0.4", optional = true }
num_cpus = { version = "1.16", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# AppKit calls winit does not expose: the window's colour before frame one, the menu bar.
objc2 = { version = "0.6", optional = true }
# Frame one drawn into the window's Metal layer before the window is shown
# (window/render.rs); the versions wgpu's Metal backend uses.
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLCommandBuffer", "MTLCommandQueue", "MTLDrawable", "MTLResource", "MTLTexture"], optional = true }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "CAMetalLayer", "objc2-metal"], optional = true }
# Performance-core count (sysctl hw.perflevel0.physicalcpu).
libc = { version = "0.2", optional = true }

[[example]]
name = "portfolio-world"
required-features = ["world-audio"]
