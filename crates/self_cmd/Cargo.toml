[package]
name = "self_cmd"
version.workspace = true
edition = "2024"

[dependencies]
deka-cli-core = { version = "0.5.0", default-features = false, features = ["registry"] }
compiler = { path = "../compiler" }
stdio = "0.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", features = ["blocking", "json"] }
sha2 = "0.10"
flate2 = "1.0"
tar = "0.4"
tempfile = "3.23.0"
ctrlc = "3"
libc = "0.2"

[dev-dependencies]
run = { path = "../run" }
serve = { path = "../serve" }
axum = "0.7"
tokio = { workspace = true }
