[package]
name = "output"
version.workspace = true
edition = "2024"
description = "Command output for the simien CLI: JSON by default, --human through stdio, the Simien mark and start banner"
publish = false

[dependencies]
dcore = { path = "../dcore" }
stdio = "0.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
