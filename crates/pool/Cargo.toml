[package]
name = "pool"
version.workspace = true
edition = "2024"

[dependencies]
carve_outs = { path = "../carve_outs" }
deka-modules = "0.3.0"
compiler = { path = "../compiler" }
serve = { path = "../serve" }
security = { path = "../security" }
permissions = { path = "../permissions" }
nanoid = { workspace = true }
core_affinity = { workspace = true }
simien_core = { workspace = true }
simien_error = { workspace = true }
libc = "0.2"
num_cpus = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = "0.1"
deka-stdio = { version = "0.4.0", package = "stdio" }
runtime_core = { path = "../runtime_core" }

# Validation + restricted SWC minify for vendored React (deka#954)
oxc_allocator = "0.152.0"
oxc_ast = "0.152.0"
oxc_ast_visit = "0.152.0"
oxc_codegen = "0.152.0"
oxc_diagnostics = "0.152.0"
oxc_minifier = "0.152.0"
oxc_parser = "0.152.0"
oxc_span = "0.152.0"

reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
deka-validation = { version = "0.2", features = ["wasm"] }

[dev-dependencies]
# RFD 27 grant fixtures: compute the fsGraph digest the lockfile pins, exactly
# as `deka install` does (crates/pm), so grant-table digests match on disk.
deka_host = { path = "../deka_host", default-features = false, features = ["runtime"] }
tempfile = "3"
platform_server = { path = "../platform_server" }

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.7.0"
