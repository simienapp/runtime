[package]
name = "runtime"
version.workspace = true
edition = "2024"

[dependencies]
server = { path = "../server" }
output = { path = "../output" }
stdio_new = { package = "stdio", version = "0.5.0" }
deka-modules = "0.3.0"
compiler = { path = "../compiler" }
run = { path = "../run" }
serve = { path = "../serve" }
security = { path = "../security" }
permissions = { path = "../permissions" }
dcore = { path = "../dcore" }
runtime_core = { path = "../runtime_core" }
platform = { path = "../platform" }
platform_server = { path = "../platform_server" }
engine = { path = "../engine" }
pool = { path = "../pool" }
transport = { path = "../transport" }
reqwest = { version = "0.13", features = ["stream"] }
bytes = { workspace = true }
deka_http = { path = "../http" }
stdio = "0.4.0"
deka_host = { path = "../deka_host", default-features = false, features = ["runtime"] }
compile = { path = "../compile" }
deka-cache = { path = "../deka_cache" }
axum = { workspace = true }
base64 = "0.21"
simien_core = { workspace = true }
num_cpus = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = "0.1"
flate2 = "1.0"
tempfile = "3.23.0"

[target.'cfg(target_os = "macos")'.dependencies]
wry = "0.50"
tao = "0.30"
