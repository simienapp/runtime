[workspace]
resolver = "2"
members = [
    "crates/deka_syntax",
    "crates/deka_fmt",
    "crates/deka_native_ir",
    "crates/deka_native_ui",
    "crates/deka_vm",
    "crates/deka_cli",
    "crates/deka_executable",
    "crates/deka_native_web",
    "crates/dcore",
    "crates/cli",
    "crates/runtime",
    "crates/runtime_core",
    "crates/run",
    "crates/serve",
    "crates/dev",
    "crates/compiler",
    "crates/security",
    "crates/permissions",
    "crates/compile",
    "crates/http",
    "crates/introspect",
    "crates/platform",
    "crates/platform_server",
    "crates/transport",
    "crates/pool",
    "crates/web_host",
  "crates/server",
  "crates/simien",
  "crates/output",
  "crates/packages",
  "crates/container",
  "crates/project",
  "crates/schema",
    "crates/engine",
    "crates/deka_host",
    "crates/wasm_guest",
    "crates/wasm_guest_macros",
    "crates/wasm_cli",
    "crates/pm",
    "crates/deka_db",
    "crates/deka_task",
    "crates/deka_deploy",
    "crates/deka_registry",
    "crates/deka_test",
    "crates/self_cmd",
    "crates/deka_cache",
    "crates/deka_build",
    "crates/corpus_gate",
]
# Vendored forks are path dependencies wired in through [patch.crates-io], not members:
# their own lints and formatting stay upstream's.
exclude = ["vendor/vello_gpu", "vendor/vello_gpu_shaders"]

[workspace.package]
version = "0.61.0"

[workspace.dependencies]
# V8 Runtime (Deno Core)
simien_core = "0.1.1"
simien_error = "0.1.1"

# Async Runtime
tokio = { version = "1.41", features = ["full"] }

# HTTP Server
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"
notify = "6"
socket2 = { version = "0.6", features = ["all"] }
core_affinity = "0.8"
nanoid = "0.5"
num_cpus = "1.16"

# TypeScript/JavaScript parsing (handler validation)
swc_ecma_parser = { version = "31.0.0", features = ["typescript"] }
swc_ecma_ast = "19.0.0"
swc_common = "18.0.1"
swc_ecma_visit = "29.0.0"

# Parser combinators
nom = "7.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
toml = "0.8"
pm = { path = "crates/pm" }

# Preserve the small shipped VM profile without changing the legacy CLI's profile.
[profile.native]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# deka's forks of vello_gpu 0.3.0 (multicore strips, staging-belt uploads, shape API,
# panics turned into errors) and vello_gpu_shaders 0.3.0 (upscaled image edges).
# The deltas against crates.io are vendor/vello_gpu.diff and vendor/vello_gpu_shaders.diff.
# Patching keeps the dependency declared as the upstream crate and version, so
# returning to upstream is deleting these lines once the changes land there.
[patch.crates-io]
vello_gpu = { path = "vendor/vello_gpu" }
vello_gpu_shaders = { path = "vendor/vello_gpu_shaders" }
